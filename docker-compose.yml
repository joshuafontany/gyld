services:
  admin:
    container_name: mws_admin
    build:
      context: .
      dockerfile: docker/mws/Dockerfile
    command: ["node", "./tiddlywiki.js", "./editions/admin", "--mws-listen"]
    working_dir: "/app/TiddlyWiki5"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    volumes:
      - ./wikis/admin:/app/TiddlyWiki5/editions/admin:ro
      - ./data/admin:/app/TiddlyWiki5/editions/admin/store
    ports:
      - "8080:8080"
    networks:
      - mws_net

  sdm:
    container_name: mws_sdm
    build:
      context: .
      dockerfile: docker/mws/Dockerfile
    command: ["node", "./tiddlywiki.js", "./editions/sdm", "--mws-listen"]
    working_dir: "/app/TiddlyWiki5"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    volumes:
      - ./wikis/sdm:/app/TiddlyWiki5/editions/sdm:ro
      - ./data/sdm:/app/TiddlyWiki5/editions/sdm/store
    ports:
      - "8081:8080"
    networks:
      - mws_net

  silat:
    container_name: mws_silat
    build:
      context: .
      dockerfile: docker/mws/Dockerfile
    command: ["node", "./tiddlywiki.js", "./editions/silat", "--mws-listen"]
    working_dir: "/app/TiddlyWiki5"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    volumes:
      - ./wikis/silat:/app/TiddlyWiki5/editions/silat:ro
      - ./data/silat:/app/TiddlyWiki5/editions/silat/store
    ports:
      - "8082:8080"
    networks:
      - mws_net

networks:
  mws_net:
    driver: bridge

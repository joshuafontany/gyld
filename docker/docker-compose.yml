version: '3.8'
services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gyld_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pds:
    image: atproto/pds:latest
    environment:
      - DATABASE_URL=postgres://admin:secret@postgres:5432/gyld_db
    depends_on:
      - postgres
    ports:
      - "2583:2583"

  tiddlywiki:
    image: node:latest
    working_dir: /app
    volumes:
      - .:/app
    command: ["npx", "tiddlywiki", "wiki", "--listen", "host=0.0.0.0"]
    ports:
      - "8080:8080"

volumes:
  pgdata:
